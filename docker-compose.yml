services:
  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ApiPruebaBnb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Configura MSSQL_SA_PASSWORD en .env};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Configura MSSQL_SA_PASSWORD en .env}"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Configura MSSQL_SA_PASSWORD en .env}"
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command: >-
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
      -Q "IF DB_ID(N'ApiPruebaBnb') IS NULL CREATE DATABASE [ApiPruebaBnb]"
    restart: "no"

volumes:
  sqlserver_data:
